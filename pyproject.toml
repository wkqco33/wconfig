[project]
name = "wpyconf"
version = "0.2.1"
description = "Layered Python configuration loader inspired by Viper"
readme = "README.md"
authors = [
    { name = "seoyc", email = "wkqco33@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7.0",
]
keywords = ["config", "configuration", "dotenv", "json", "toml", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/wkqco33/wconfig"
Repository = "https://github.com/wkqco33/wconfig.git"
Issues = "https://github.com/wkqco33/wconfig/issues"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
# Configuration data is intentionally dynamic at the parser/API boundary.
reportAny = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnusedCallResult = "none"
reportDeprecated = "none"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wconfig"
